    @media (max-width: 640px) {
      h1 { font-size: 1.6rem; }
      .viewer { gap: .75rem; }
    }
  </style>
  <script>
    // Apply saved theme before paint to avoid a flash
    (function () {
      var t = null;
      try { t = localStorage.getItem('ptTheme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header>
    <a class="home" href="/">← abaah17</a>
    <button id="theme-toggle" aria-label="Toggle dark mode">🌓</button>
  </header>

  <main>
    <section class="intro">
      <div>
        <h1>Resume</h1>
        <p>Data Center Technician · AZ-500 · Cloud Security &amp; SecOps</p>
      </div>
      <div class="actions">
        <a class="btn btn-outline" href="resume.pdf" download="Anthony_Baah_Resume.pdf">Download PDF</a>
      </div>
    </section>

    <div class="viewer" id="viewer" aria-label="Anthony Baah resume">
      <p class="status" id="status">Loading resume…</p>
    </div>
    <p class="updated">Last updated: October 2026</p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (function () {
      var PDF_URL = 'resume.pdf';
      var viewer = document.getElementById('viewer');
      var status = document.getElementById('status');
      var pdfDoc = null;
      var lastWidth = 0;

      function fail() {
        status.innerHTML = 'Couldn\u2019t load the resume. <a href="' + PDF_URL + '">Open it directly</a>.';
      }

      if (!window.pdfjsLib) { fail(); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      function render() {
        var width = Math.min(viewer.clientWidth, 850);
        if (!pdfDoc || width === lastWidth) return;
        lastWidth = width;
        var dpr = window.devicePixelRatio || 1;
        var tasks = [];
        for (var i = 1; i <= pdfDoc.numPages; i++) tasks.push(pdfDoc.getPage(i));
        Promise.all(tasks).then(function (pages) {
          viewer.innerHTML = '';
          pages.forEach(function (page) {
            var base = page.getViewport({ scale: 1 });
            var vp = page.getViewport({ scale: (width / base.width) * dpr });
            var canvas = document.createElement('canvas');
            canvas.width = vp.width;
            canvas.height = vp.height;
            canvas.setAttribute('role', 'img');
            canvas.setAttribute('aria-label', 'Resume page ' + page.pageNumber);
            viewer.appendChild(canvas);
            page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
          });
        });
      }

      pdfjsLib.getDocument(PDF_URL).promise.then(function (doc) {
        pdfDoc = doc;
        render();
      }).catch(fail);

      var t;
      window.addEventListener('resize', function () {
        clearTimeout(t);
        t = setTimeout(render, 200);
      });
    })();
  </script>
  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('ptTheme', next); } catch (e) {}
    });
  </script>
</body>
</html>
