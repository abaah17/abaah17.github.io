<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume | Anthony Baah</title>
  <meta name="description" content="Resume of Anthony Baah — Data Center Technician, AZ-500 certified, focused on cloud security and security operations.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #1a1d23;
      --muted: #5b6270;
      --border: #e2e5ea;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }
    [data-theme="dark"] {
      --bg: #0f1115;
      --surface: #171a21;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --border: #2a2f39;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background .2s, color .2s;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1000px; margin: 0 auto; padding: 1.25rem 1rem;
    }
    header a.home { color: var(--text); text-decoration: none; font-weight: 600; }
    header a.home:hover { color: var(--accent); }
    #theme-toggle {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .4rem .7rem; cursor: pointer; font-size: 1rem;
    }
    main { max-width: 1000px; margin: 0 auto; padding: 0 1rem 3rem; }
    .intro {
      display: flex; flex-wrap: wrap; gap: 1rem;
      justify-content: space-between; align-items: flex-end;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 2rem; line-height: 1.2; }
    .intro p { color: var(--muted); }
    .actions { display: flex; gap: .6rem; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: .6rem 1.1rem; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: .95rem;
      border: 1px solid var(--accent);
    }
    .btn-outline { color: var(--accent); }
    .btn-outline:hover { background: var(--surface); }
    .viewer { display: flex; flex-direction: column; gap: 1.25rem; align-items: center; }
    .viewer canvas {
      display: block; width: 100%; max-width: 850px; height: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    .status { padding: 3rem 1rem; text-align: center; color: var(--muted); }
    .status a { color: var(--accent); }
    .updated { margin-top: 1rem; font-size: .85rem; color: var(--muted); text-align: center; }
